<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Server Running</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }
        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background: #22c55e;
            color: #fff;
            font-weight: bold;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Server Status</h1>
        <p>Aapka Vercel Server & Telegram Webhook API perfectly online aur active hai.</p>
        <div class="status">● Active & Operational</div>
    </div>

</body>
</html>
